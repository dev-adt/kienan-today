<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Navy to Dark Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43" />
      <stop offset="60%" stop-color="#0B1D2E" />
      <stop offset="100%" stop-color="#050E17" />
    </linearGradient>

    <!-- Teal Gradient: Emerald Teal to Electric Cyan -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="50%" stop-color="#007F82" />
      <stop offset="100%" stop-color="#025359" />
    </linearGradient>

    <!-- Warm Gold Gradient: Sunlight & Innovation -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F4B544" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- ADT Brand Accent Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#D62839" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#tealGrad)" stroke-width="8" opacity="0.85" />
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35" />

  <!-- Data Stream / Neural AI Network Arc -->
  <g stroke="url(#tealGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="6 6">
    <ellipse cx="256" cy="240" rx="180" ry="85" fill="none" transform="rotate(-15 256 240)" />
    <ellipse cx="256" cy="240" rx="180" ry="85" fill="none" transform="rotate(25 256 240)" />
  </g>

  <!-- Network AI Constellation Nodes -->
  <g fill="url(#goldGrad)">
    <circle cx="120" cy="180" r="5" filter="url(#glow)" />
    <circle cx="390" cy="160" r="6" filter="url(#glow)" />
    <circle cx="410" cy="270" r="4.5" />
    <circle cx="105" cy="290" r="5" />
    <circle cx="256" cy="100" r="6" filter="url(#glow)" />
  </g>

  <!-- Thien Van Mountain Silhouette (Đồi Thiên Văn) -->
  <path d="M 80 370 Q 180 230 256 210 Q 330 230 432 370 Z" fill="url(#tealGrad)" opacity="0.3" />
  <path d="M 120 370 Q 210 260 256 235 Q 310 260 392 370 Z" fill="#0D253A" opacity="0.75" />

  <!-- Phu Lien Meteorological & Astronomical Observatory Dome (Đài Khí tượng Phù Liễn) -->
  <g transform="translate(256, 215)">
    <!-- Observatory Base -->
    <rect x="-36" y="0" width="72" height="48" rx="4" fill="#E2E8F0" />
    <rect x="-42" y="44" width="84" height="10" rx="2" fill="url(#goldGrad)" />
    <!-- Telescope Dome Half-circle -->
    <path d="M -30 0 A 30 30 0 0 1 30 0 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Telescope Slit -->
    <line x1="0" y1="-28" x2="8" y2="0" stroke="#102A43" stroke-width="6" stroke-linecap="round" />
    <!-- Observatory Window Arches -->
    <rect x="-24" y="14" width="10" height="18" rx="5" fill="#102A43" />
    <rect x="-5" y="14" width="10" height="18" rx="5" fill="#102A43" />
    <rect x="14" y="14" width="10" height="18" rx="5" fill="#102A43" />
  </g>

  <!-- Lake Ripple Waves (Hồ Hạnh Phúc) -->
  <g stroke="url(#tealGrad)" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M 110 375 Q 180 360 256 375 Q 332 390 402 375" opacity="0.9" />
    <path d="M 140 400 Q 200 390 256 400 Q 312 410 372 400" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7" />
  </g>

  <!-- ADT Red Spark / Innovation Star -->
  <polygon points="256,76 261,90 275,90 264,99 268,113 256,104 244,113 248,99 237,90 251,90" fill="url(#redGrad)" filter="url(#glow)" />

  <!-- Monogram "KA" (Kiến An) in Crisp White and Gold Accent -->
  <text x="256" y="460" text-anchor="middle" font-family="'Be Vietnam Pro', 'Outfit', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="6">
    KIEN AN
  </text>
</svg>
